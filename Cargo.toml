[package]
name = "agent-sign"
version = "0.1.0"
edition = "2024"
description = "Signed git commits for AI agents, with one approval you can see and revoke"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taylor-made-labs/agent-sign"

[lib]
name = "agent_sign"
path = "src/lib.rs"

# The command line; also accepts git's signing arguments, as agent-sign did.
[[bin]]
name = "agent-sign"
path = "src/bin/agent_sign.rs"

# The service (formerly agent-signd).
[[bin]]
name = "agent-signd"
path = "src/bin/agent_signd.rs"

# The signing program git calls as gpg.ssh.program.
[[bin]]
name = "agent-ssh-sign"
path = "src/bin/agent_ssh_sign.rs"

# The git wrapper, installed as `git` (formerly agent-git).
[[bin]]
name = "agent-git"
path = "src/bin/agent_git.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.12"

