[package]
name = "agent-sign"
version = "0.1.0"
edition = "2024"
description = "Signed git commits for AI agents, with one approval you can see and revoke"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taylor-made-labs/agent-sign"

[lib]
name = "agent_sign"
path = "src/lib.rs"

# The command line; also accepts git's signing arguments, as agent-sign did.
[[bin]]
name = "agent-sign"
path = "src/bin/agent_sign.rs"

# The service (formerly agent-signd).
[[bin]]
name = "agent-signd"
path = "src/bin/agent_signd.rs"

# The signing program git calls as gpg.ssh.program.
[[bin]]
name = "agent-ssh-sign"
path = "src/bin/agent_ssh_sign.rs"

# The git wrapper, installed as `git` (formerly agent-git).
[[bin]]
name = "agent-git"
path = "src/bin/agent_git.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1.8"
libc = "=0.2.189"
# OpenSSH certificates for agents' signing keys: the service issues each agent
# session a short-lived certificate for its principal, from the agents'
# certificate authority, and git and ssh-keygen verify commits through it.
# RustCrypto's ssh-key is the maintained, widely used implementation of the
# OpenSSH key and certificate formats (Apache-2.0 OR MIT, like the rest of
# this tree); encoding certificates by hand would be more security-critical
# code of our own to audit. It reuses the ed25519-dalek and sha2 already
# here. The exact version is pinned here as well as in Cargo.lock, so an
# upgrade is its own change; only the features the service calls are on.
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "ed25519"] }

# macOS only: the bridge to the system's LocalAuthentication framework
# (Touch ID, Apple Watch, or the login password), which the service uses to
# confirm that the device's owner, not a program, approved a lease. The objc2
# family is the maintained, widely used set of Rust bindings to Apple's
# frameworks (MIT, or Zlib / Apache-2.0 / MIT for the generated bindings); a
# hand-written Objective-C shim would need a C compiler at build time and
# more unsafe code to audit than these typed bindings. Exact versions are
# pinned here as well as in Cargo.lock, so an upgrade is its own change.
# Only the features the bridge calls are on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[features]
# Lets tests stand in for the owner's authentication (`AGENT_SIGN_TEST_AUTH`).
# Never on in a normal build: the dev-dependency below turns it on for
# `cargo test` and `cargo clippy --all-targets` only.
test-authenticator = []

[dev-dependencies]
tempfile = "3.12"
# Turns `test-authenticator` on for the test builds of the service, and only
# those: `cargo build [--release]` never has it.
agent-sign = { path = ".", features = ["test-authenticator"] }

