name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: agent-sign-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: agent-sign-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: agent-sign-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          STAGING_DIR="pkg/${{ matrix.archive_name }}"
          mkdir -p "$STAGING_DIR/bin"
          mkdir -p "$STAGING_DIR/scripts"

          # Copy compiled binaries
          cp "target/${{ matrix.target }}/release/agent-signd" "$STAGING_DIR/bin/"
          cp "target/${{ matrix.target }}/release/agent-sign"  "$STAGING_DIR/bin/"
          cp "target/${{ matrix.target }}/release/agent-git"   "$STAGING_DIR/bin/"
          cp "target/${{ matrix.target }}/release/agent-git"   "$STAGING_DIR/bin/git"

          # Copy scripts and metadata
          cp -r scripts/* "$STAGING_DIR/scripts/"
          cp README.md LICENSE "$STAGING_DIR/"

          # Create archive
          cd pkg
          tar -czf "${{ matrix.archive_name }}.tar.gz" "${{ matrix.archive_name }}"
          shasum -a 256 "${{ matrix.archive_name }}.tar.gz" > "${{ matrix.archive_name }}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            pkg/*.tar.gz
            pkg/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate archives and generate combined checksums
        run: |
          mkdir -p dist
          find release-artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
