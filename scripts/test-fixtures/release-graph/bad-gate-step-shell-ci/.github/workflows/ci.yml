name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to check out and test'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fail unless the checkout is the requested commit
        if: inputs.ref != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        shell: echo {0}
        run: cargo test --locked --no-fail-fast

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the whole history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Fail unless the checkout is the requested commit
        if: inputs.ref != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: own scan
        run: python3 scripts/release/scan-history-secrets.py . --all

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fail unless the checkout is the requested commit
        if: inputs.ref != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268d5947a7a16b4649013fea1 # v2

  install:
    name: Install test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fail unless the checkout is the requested commit
        if: inputs.ref != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: cargo build --release --locked
      - name: Install test
        run: scripts/release/install-test.sh

  release-graph:
    name: Release workflow graph (structural check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fail unless the checkout is the requested commit
        if: inputs.ref != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: Check the release graph of these workflows
        run: python3 scripts/check-release-graph.py .
      - name: The checker's own tests
        run: python3 -m unittest scripts/test_check_release_graph.py
